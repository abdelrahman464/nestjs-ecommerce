services:
  redis:
    image: redis:7-alpine
    container_name: nest-ecommerc-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-ecommerc-api
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Redis is the compose service. MONGO_URI stays Atlas from .env.development.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
